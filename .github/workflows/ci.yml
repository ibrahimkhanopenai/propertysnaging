name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: propertyinspectors
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/propertyinspectors
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      NEXT_PUBLIC_SITE_URL: https://propertyinspectors.me
      UPLOAD_DIR: ./storage/uploads
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - name: Migrations apply cleanly
        run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: SEO audit against the production build
        run: |
          npm start -- -p 3000 &
          npx --yes wait-on@8 -t 60000 http://localhost:3000/
          npm run seo:audit -- http://localhost:3000
